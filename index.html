<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Blobe scroll</title>
<link rel="icon" type="image/png" href="icon.png">
<style>
:root{--bg:#000;--line:#242424;--muted:#aaa;--pink:#fe2c55;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:#000;color:#fff;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}
button,select{font:inherit}button{color:inherit}svg{display:block}
.app{height:100%;display:grid;grid-template-columns:220px minmax(330px,560px) 285px;justify-content:center;background:#000}
.sidebar{height:100vh;border-right:1px solid var(--line);padding:24px 14px 18px;display:flex;flex-direction:column;gap:7px}
.logo{padding:4px 7px 22px;display:flex;align-items:center;justify-content:center}.logo img{display:block;width:100%;max-width:190px;height:auto}
.nav{border:0;background:transparent;border-radius:11px;padding:12px 13px;display:flex;align-items:center;gap:15px;cursor:pointer;text-align:left;font-size:15px}
.nav:hover{background:#111}.nav.active{font-weight:800}.nav svg{width:24px;height:24px}.spacer{flex:1}
.feed-shell{height:100vh;min-width:0;position:relative;background:#050505}
.topbar{position:absolute;z-index:20;left:0;right:0;top:0;padding:calc(11px + var(--safe-top)) 14px 25px;display:flex;justify-content:center;background:linear-gradient(#000c,transparent);pointer-events:none}
.topbar b{font-size:14px;font-weight:850}
.api-dot{position:absolute;right:14px;top:calc(17px + var(--safe-top));z-index:21;width:9px;height:9px;border-radius:50%;background:#777;box-shadow:0 0 0 3px #0008}.api-dot.ok{background:#2ed573}.api-dot.bad{background:#ff4757}
.feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior-y:contain}.feed::-webkit-scrollbar{display:none}
.reel,.loader-reel{height:100vh;scroll-snap-align:start;scroll-snap-stop:always}
.reel{position:relative;background:#070707;overflow:hidden}
.video-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#050505}
.cover-blur{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(35px) brightness(.25);transform:scale(1.14);opacity:.9}
video{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;background:#050505}
.shade{position:absolute;z-index:2;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(0,0,0,.28),transparent 24%,transparent 58%,rgba(0,0,0,.84) 100%)}
.tap{position:absolute;z-index:4;inset:70px 80px 105px 0;cursor:pointer}
.play{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%) scale(.8);width:66px;height:66px;border-radius:50%;background:#0009;display:grid;place-items:center;opacity:0;transition:.15s;pointer-events:none}
.reel.paused .play{opacity:1;transform:translate(-50%,-50%) scale(1)}.play svg{width:29px;margin-left:4px}
.meta{position:absolute;z-index:7;left:15px;right:80px;bottom:37px;text-shadow:0 1px 5px #000}
.userline{display:flex;align-items:center;gap:9px;margin-bottom:8px}.userline strong{font-size:15px}
.caption{font-size:14px;line-height:1.35;max-height:58px;overflow:hidden}
.music{margin-top:8px;font-size:12px;font-weight:700;display:flex;gap:6px;overflow:hidden;white-space:nowrap}.music span{overflow:hidden;text-overflow:ellipsis}
.actions{position:absolute;z-index:8;right:8px;bottom:34px;width:67px;display:flex;flex-direction:column;align-items:center;gap:16px}
.action{border:0;background:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:800;text-shadow:0 1px 5px #000}
.bubble{width:45px;height:45px;border-radius:50%;background:#232323a8;display:grid;place-items:center;backdrop-filter:blur(4px)}
.action svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2}.action.liked svg{fill:var(--pink);stroke:var(--pink)}
.avatar{width:47px;height:47px;border-radius:50%;border:2px solid #fff;background:#222;object-fit:cover}
.avatar-fallback{width:47px;height:47px;border-radius:50%;border:2px solid #fff;background:linear-gradient(145deg,#f9b208,var(--pink),#7048e8);display:grid;place-items:center;font-weight:900;font-size:13px}
.disc{width:42px;height:42px;border-radius:50%;background:repeating-radial-gradient(circle,#333 0 3px,#111 4px 7px);border:7px solid #1b1b1b;animation:spin 5s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.progress{position:absolute;z-index:9;bottom:0;left:0;right:0;height:2px;background:#ffffff24}.progress i{display:block;height:100%;width:0;background:#fff}
.loader-reel{display:grid;place-items:center;text-align:center;padding:30px;background:#050505}.spinner{width:38px;height:38px;border:3px solid #333;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;margin:auto auto 13px}
.errorbox{max-width:360px;color:#aaa;line-height:1.5}.errorbox h2{color:#fff;margin:0 0 8px}.errorbox button{border:0;background:#fff;color:#000;border-radius:9px;padding:10px 15px;font-weight:850;cursor:pointer;margin-top:10px}
.rightbar{height:100vh;border-left:1px solid var(--line);padding:22px 19px;overflow:auto}
.card{border:1px solid var(--line);border-radius:14px;background:#0a0a0a;padding:14px;margin-bottom:14px}.card h3{font-size:14px;margin:0 0 10px}.card p{font-size:12px;color:#aaa;line-height:1.45;margin:0}
.row{display:flex;gap:8px;align-items:center}.row+.row{margin-top:9px}
select{width:100%;background:#141414;color:#fff;border:1px solid #333;border-radius:9px;padding:9px 10px;outline:none}.btn{border:0;background:#fff;color:#000;border-radius:9px;padding:9px 11px;font-weight:850;cursor:pointer}.btn.dark{background:#171717;color:#fff;border:1px solid #333}
.mobile-nav{display:none}.mobile-nav button.active{opacity:1}.mobile-nav button:not(.active){opacity:.72}
.toast{position:fixed;z-index:200;left:50%;bottom:20px;transform:translate(-50%,20px);background:#fff;color:#000;border-radius:999px;padding:9px 14px;font-size:12px;font-weight:850;opacity:0;pointer-events:none;transition:.18s}.toast.show{opacity:1;transform:translate(-50%,0)}
.backdrop{position:fixed;z-index:90;inset:0;background:#0009;opacity:0;pointer-events:none;transition:.2s}.backdrop.open{opacity:1;pointer-events:auto}
.drawer{position:fixed;z-index:91;right:0;top:0;bottom:0;width:min(430px,100vw);background:#0c0c0c;border-left:1px solid #2a2a2a;transform:translateX(100%);transition:.24s;display:flex;flex-direction:column}.drawer.open{transform:none}
.drawer-head{height:58px;border-bottom:1px solid #262626;display:flex;align-items:center;justify-content:space-between;padding:0 15px;font-weight:850}.close{border:0;background:none;cursor:pointer;padding:8px}

.profile-drawer{position:fixed;z-index:92;right:0;top:0;bottom:0;width:min(470px,100vw);background:#0c0c0c;border-left:1px solid #2a2a2a;transform:translateX(100%);transition:.24s;display:flex;flex-direction:column}
.profile-drawer.open{transform:none}
.profile-content{flex:1;overflow:auto}
.profile-loading{padding:42px 20px;text-align:center;color:#888}
.profile-hero{padding:24px 18px 18px;border-bottom:1px solid #242424}
.profile-identity{display:flex;align-items:center;gap:14px}
.profile-big-avatar{width:82px;height:82px;border-radius:50%;object-fit:cover;background:#222;flex:0 0 auto}
.profile-big-fallback{width:82px;height:82px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#f9b208,var(--pink),#7048e8);font-size:22px;font-weight:900;flex:0 0 auto}
.profile-names{min-width:0}
.profile-names h2{margin:0;font-size:21px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile-names .handle{margin-top:5px;color:#aaa;font-size:13px}
.verified{display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:#20a8ff;font-size:10px;margin-left:4px;vertical-align:2px}
.profile-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;text-align:center}
.profile-stat{border:1px solid #242424;background:#111;border-radius:11px;padding:10px 5px}
.profile-stat b{display:block;font-size:15px}
.profile-stat span{display:block;color:#888;font-size:10px;margin-top:2px}
.profile-bio{font-size:13px;line-height:1.45;color:#ddd;margin-top:15px;white-space:pre-wrap}
.profile-posts-head{display:flex;align-items:center;justify-content:space-between;padding:14px 15px;border-bottom:1px solid #232323;font-size:13px;font-weight:850}
.profile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:#090909}
.profile-post{position:relative;aspect-ratio:9/12;border:0;padding:0;background:#151515;overflow:hidden;cursor:pointer}
.profile-post img{width:100%;height:100%;object-fit:cover;display:block}
.profile-post-shade{position:absolute;inset:auto 0 0;padding:22px 6px 6px;background:linear-gradient(transparent,#000c);font-size:10px;font-weight:800;text-align:left}
.profile-empty{padding:36px 20px;text-align:center;color:#888;font-size:13px;line-height:1.5}
.comment-user{appearance:none;border:0;background:none;color:inherit;padding:0;display:flex;gap:10px;text-align:left;cursor:pointer;max-width:100%}
.comment-user:hover b{text-decoration:underline}

/* Saved library: Shorts-style thumbnail grid + dedicated saved viewer */
.saved-back{display:none;position:absolute;z-index:24;left:10px;top:calc(9px + var(--safe-top));height:38px;border:0;border-radius:999px;background:#171717cc;color:#fff;padding:0 12px 0 9px;align-items:center;gap:7px;font-size:13px;font-weight:800;cursor:pointer;backdrop-filter:blur(8px)}
.saved-back.show{display:flex}.saved-back:hover{background:#242424}.saved-back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}
.feed.saved-grid-mode{scroll-snap-type:none;overscroll-behavior-y:auto;background:#050505}
.saved-library{min-height:100%;padding:64px 10px 82px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-content:start;gap:14px 8px;background:#050505}
.saved-card{border:0;background:none;color:#fff;padding:0;min-width:0;text-align:left;cursor:pointer}
.saved-thumb{position:relative;display:block;width:100%;aspect-ratio:9/16;border-radius:9px;overflow:hidden;background:#161616}
.saved-thumb img{width:100%;height:100%;display:block;object-fit:cover;transition:transform .18s ease}
.saved-thumb::after{content:"";position:absolute;inset:auto 0 0;height:42%;background:linear-gradient(transparent,#000b);pointer-events:none}
.saved-card:hover .saved-thumb img{transform:scale(1.025)}
.saved-count{position:absolute;z-index:2;left:7px;bottom:7px;display:flex;align-items:center;gap:4px;font-size:10px;font-weight:850;text-shadow:0 1px 4px #000}
.saved-card-title{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;margin-top:7px;font-size:12px;line-height:1.28;font-weight:700}
.saved-card-user{display:block;margin-top:3px;color:#8f8f8f;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.saved-library-empty{grid-column:1/-1;min-height:calc(100vh - 146px);display:grid;place-items:center;text-align:center;padding:30px;color:#aaa}
.saved-library-empty h2{margin:0 0 8px;color:#fff;font-size:20px}.saved-library-empty p{margin:0;max-width:320px;line-height:1.45;font-size:13px}

.comments{flex:1;overflow:auto;padding:16px}.comment{display:flex;gap:10px;margin-bottom:17px}.comment img,.cavi{width:34px;height:34px;border-radius:50%;object-fit:cover;background:#242424;flex:0 0 auto}.cavi{display:grid;place-items:center;font-size:10px;font-weight:800}.ctext{font-size:13px;line-height:1.35}.ctext b{display:block;margin-bottom:3px}.ctext small{display:block;color:#777;margin-top:4px}
@media(max-width:1040px){.app{grid-template-columns:78px minmax(330px,560px) 0}.sidebar{padding:24px 11px}.logo{padding:4px 2px 20px}.logo img{width:68px;max-width:none}.nav{justify-content:center;padding:13px}.nav span{display:none}.rightbar{display:none}}
@media(max-width:680px){.app{display:block}.sidebar{display:none}.feed-shell,.reel,.loader-reel{height:100dvh}.meta{bottom:calc(68px + var(--safe-bottom))}.actions{bottom:calc(67px + var(--safe-bottom))}.progress{bottom:calc(54px + var(--safe-bottom))}
.mobile-nav{display:flex;position:absolute;z-index:30;left:0;right:0;bottom:0;height:calc(55px + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:#000;border-top:1px solid #1f1f1f;justify-content:space-around;align-items:center}.mobile-nav button{border:0;background:none;padding:9px 14px;cursor:pointer}.mobile-nav svg{width:24px;height:24px}.toast{bottom:calc(70px + var(--safe-bottom))}.saved-library{padding-bottom:calc(72px + var(--safe-bottom));gap:12px 6px}.saved-thumb{border-radius:7px}.saved-card-title{font-size:11px}}
</style>
</head>

    <button id="mHome"><svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5v9A1.5 1.5 0 0 1 19.5 21H15v-7H9v7H4.5A1.5 1.5 0 0 1 3 19.5z" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button id="mSaved" aria-label="Saved videos"><svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button id="mRefresh"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="6" fill="#fff"/><path d="M8 12h8M12 8v8" stroke="#000" stroke-width="2"/></svg></button>
    <button id="mSound"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
    <button id="mAbout"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 10v7M12 7h.01" stroke="currentColor" stroke-width="2"/></svg></button>
  </nav>
</main>

<aside class="rightbar">
  <div class="card">
    <h3>Region</h3>
    <div class="row">
      <select id="region">
        <option value="US">United States</option><option value="GB">United Kingdom</option><option value="CA">Canada</option>
        <option value="AU">Australia</option><option value="JP">Japan</option><option value="KR">South Korea</option>
        <option value="FR">France</option><option value="DE">Germany</option><option value="BR">Brazil</option><option value="MX">Mexico</option>
      </select>
    </div>
    <div class="row"><button class="btn" id="applyRegion">Connect VPN</button><button class="btn dark" id="shuffleBtn">Shuffle</button></div>
  </div>
</aside>
</div>

<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="commentsDrawer">
  <div class="drawer-head"><span id="commentsTitle">Comments</span><button class="close" id="closeComments"><svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2"/></svg></button></div>
  <div class="comments" id="commentsList"></div>
</aside>
<aside class="profile-drawer" id="profileDrawer">
  <div class="drawer-head">
    <span id="profileTitle">Profile</span>
    <button class="close" id="closeProfile" aria-label="Close profile">
      <svg viewBox="0 0 24 24" width="24" height="24"><path d="M5 5l14 14M19 5 5 19" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>
  <div class="profile-content" id="profileContent"></div>
</aside>
<div class="toast" id="toast"></div>

<script>
(() => {
  const SERVICE_HOST=["tik","wm.com"].join("");
  const SOURCE_HOST=["tik","tok.com"].join("");
  const API_BASES=[`https://www.${SERVICE_HOST}/api`,`https://${SERVICE_HOST}/api`];
  const SERVICE_ORIGIN=`https://www.${SERVICE_HOST}`;
  const SOURCE_ORIGIN=`https://www.${SOURCE_HOST}`;
  const FILLER_TERMS=["fyp","viral","funny","meme","storytime","gaming","edit","music","animals","food"];

  const feed=document.getElementById("feed");
  const apiDot=document.getElementById("apiDot");
  const regionSelect=document.getElementById("region");
  const drawer=document.getElementById("commentsDrawer");
  const backdrop=document.getElementById("backdrop");
  const commentsList=document.getElementById("commentsList");
  const commentsTitle=document.getElementById("commentsTitle");
  const profileDrawer=document.getElementById("profileDrawer");
  const profileContent=document.getElementById("profileContent");
  const profileTitle=document.getElementById("profileTitle");
  const feedTitle=document.getElementById("feedTitle");
  const savedBackBtn=document.getElementById("savedBackBtn");

  let videos=[];
  let ids=new Set();
  let activeIndex=0;
  let renderedCount=0;
  let loading=false;
  let batches=0;
  let soundOn=true;
  let observer=null;
  let activeFeedElement=null;
  let currentView="home";
  let liked=new Set(JSON.parse(localStorage.getItem("blobe-scroll-liked")||"[]"));
  let saved=new Set(JSON.parse(localStorage.getItem("blobe-scroll-saved")||"[]"));
  let savedVideos=new Map();
  try{
    const stored=JSON.parse(localStorage.getItem("blobe-scroll-saved-videos")||"[]");
    if(Array.isArray(stored))for(const v of stored)if(v&&v.id)savedVideos.set(String(v.id),v);
  }catch{}
  for(const id of savedVideos.keys())saved.add(id);
  let profileReturnToComments=false;
  let currentProfileUsername="";

  const fmt=n=>{n=Number(n||0);if(n>=1e9)return(n/1e9).toFixed(n>=1e10?0:1).replace(".0","")+"B";if(n>=1e6)return(n/1e6).toFixed(n>=1e7?0:1).replace(".0","")+"M";if(n>=1e3)return(n/1e3).toFixed(n>=1e4?0:1).replace(".0","")+"K";return String(n||0)};
  const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const persist=(k,s)=>localStorage.setItem(k,JSON.stringify([...s]));
  const persistSaved=()=>{
    persist("blobe-scroll-saved",saved);
    localStorage.setItem("blobe-scroll-saved-videos",JSON.stringify([...savedVideos.values()]));
  };
  const videoById=id=>videos.find(v=>v.id===id)||savedVideos.get(String(id))||null;
  const toast=t=>{const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("show"),1800)};

  function guessRegion(){
    const lang=(navigator.language||"en-US").split("-")[1];
    if(lang&&[...regionSelect.options].some(o=>o.value===lang))regionSelect.value=lang;
  }

  async function fetchWithTimeout(url,options={},timeout=14000){
    const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);
    try{return await fetch(url,{...options,signal:controller.signal})}finally{clearTimeout(timer)}
  }

  function validApiJson(j){
    if(!j||typeof j!=="object")throw new Error("Invalid feed response");
    if(Number(j.code)!==0)throw new Error(j.msg||"Feed error");
    return j.data;
  }

  async function api(path,params={}){
    let lastErr;
    for(const base of API_BASES){
      try{
        const u=new URL(base+path);
        for(const[k,v]of Object.entries(params))if(v!==undefined&&v!==null)u.searchParams.set(k,v);
        const r=await fetchWithTimeout(u,{method:"GET",mode:"cors",cache:"no-store",headers:{"Accept":"application/json,text/plain,*/*"}});
        if(!r.ok)throw new Error("HTTP "+r.status);
        const data=validApiJson(await r.json());
        apiDot.className="api-dot ok";
        return data;
      }catch(e){lastErr=e}
    }
    apiDot.className="api-dot bad";
    throw lastErr||new Error("Feed unavailable");
  }

  function normalize(v){
    const a=v.author||{},m=v.music_info||v.music||{};
    const id=String(v.video_id||v.id||"");
    let play=v.hdplay||v.play||v.wmplay||v.download_addr||"";
    let cover=v.cover||v.origin_cover||v.ai_dynamic_cover||"";
    let avatar=a.avatar||a.avatarThumb||a.avatar_thumb||"";
    try{if(play)play=new URL(play,SERVICE_ORIGIN).href}catch{}
    try{if(cover)cover=new URL(cover,SERVICE_ORIGIN).href}catch{}
    try{if(avatar)avatar=new URL(avatar,SERVICE_ORIGIN).href}catch{}
    return{id,play,cover,title:v.title||v.desc||"Blobe Scroll video",duration:Number(v.duration||0),createTime:Number(v.create_time||0),playCount:Number(v.play_count||0),likeCount:Number(v.digg_count||0),commentCount:Number(v.comment_count||0),shareCount:Number(v.share_count||0),username:a.unique_id||a.uniqueId||v.author_unique_id||"blobe",nickname:a.nickname||a.unique_id||"Blobe creator",avatar,musicTitle:m.title||"Original sound",musicAuthor:m.author||a.nickname||a.unique_id||""};
  }

  function addItems(items){
    let added=0,savedChanged=false;
    for(const raw of(items||[])){
      const v=normalize(raw);
      if(!v.id||!v.play||ids.has(v.id))continue;
      ids.add(v.id);videos.push(v);added++;
      if(saved.has(v.id)){savedVideos.set(v.id,v);savedChanged=true}
    }
    if(savedChanged)persistSaved();
    return added;
  }

  async function loadMore(reset=false){
    if(loading)return;
    loading=true;
    if(reset){
      pauseAll();
      videos=[];ids.clear();activeIndex=0;renderedCount=0;batches=0;
      feed.innerHTML=`<div class="loader-reel" id="initialLoader"><div><div class="spinner"></div><b>Loading…</b></div></div>`;
    }
    try{
      let added=0;
      const data=await api("/feed/list",{region:regionSelect.value,count:20});
      added+=addItems(Array.isArray(data)?data:(data?.videos||[]));

      if(added<5){
        const endpoint="/feed/"+["se","arch"].join("");
        const term=FILLER_TERMS[batches%FILLER_TERMS.length];
        const extra=await api(endpoint,{keywords:term,count:20,cursor:(batches*20),web:1});
        added+=addItems(extra?.videos||[]);
      }

      batches++;
      document.getElementById("initialLoader")?.remove();
      appendNewCards();
      if(!videos.length)throw new Error("No playable videos returned");
      if(reset)setTimeout(()=>activate(0,true),120);
    }catch(e){
      console.error(e);
      if(!videos.length){
        feed.innerHTML=`<div class="loader-reel"><div class="errorbox"><h2>Feed unavailable</h2><div>${esc(e.message)}</div><button id="retryFeed">Try again</button></div></div>`;
        document.getElementById("retryFeed")?.addEventListener("click",()=>loadMore(true));
      }else toast("Couldn't load more videos");
    }finally{loading=false}
  }

  function icon(name){
    return{
      play:`<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></svg>`,
      heart:`<svg viewBox="0 0 24 24"><path d="M20.8 8.6c0 5.3-8.8 11.2-8.8 11.2S3.2 13.9 3.2 8.6A4.6 4.6 0 0 1 12 6.7a4.6 4.6 0 0 1 8.8 1.9Z"/></svg>`,
      comment:`<svg viewBox="0 0 24 24"><path d="M20.5 11.2a8.4 8.4 0 0 1-9 8.3 9.7 9.7 0 0 1-3.4-.9L3 20l1.5-4.7A8.3 8.3 0 1 1 20.5 11.2Z"/></svg>`,
      save:`<svg viewBox="0 0 24 24"><path d="M6 3.5h12v17l-6-4-6 4z"/></svg>`,
      share:`<svg viewBox="0 0 24 24"><path d="M21 3 3.8 10.1c-1 .4-.9 1.9.2 2.1l7 1.5 1.7 6.3c.3 1.1 1.8 1.2 2.2.2z"/><path d="m11 13.7 4-4"/></svg>`
    }[name]
  }

  function avatarHTML(v){
    return v.avatar?`<img class="avatar" loading="lazy" src="${esc(v.avatar)}" alt="">`:`<div class="avatar-fallback">${esc(v.username.slice(0,2).toUpperCase())}</div>`;
  }

  function reelMarkup(v,i){
    return`<section class="reel paused" data-index="${i}" data-id="${esc(v.id)}">
      <div class="video-wrap"><div class="cover-blur" style="background-image:url('${esc(v.cover)}')"></div><video playsinline loop preload="metadata" poster="${esc(v.cover)}" src="${esc(v.play)}"></video><div class="shade"></div><div class="tap"></div><div class="play">${icon("play")}</div></div>
      <div class="meta"><div class="userline"><strong>@${esc(v.username)}</strong></div><div class="caption">${esc(v.title)}</div><div class="music">♫ <span>${esc(v.musicTitle)}${v.musicAuthor?" · "+esc(v.musicAuthor):""}</span></div></div>
      <div class="actions">
        <button class="action" data-profile="${esc(v.username)}">${avatarHTML(v)}</button>
        <button class="action ${liked.has(v.id)?"liked":""}" data-like="${esc(v.id)}"><span class="bubble">${icon("heart")}</span><span>${liked.has(v.id)?"Liked":fmt(v.likeCount)}</span></button>
        <button class="action" data-comment="${esc(v.id)}"><span class="bubble">${icon("comment")}</span><span>${fmt(v.commentCount)}</span></button>
        <button class="action ${saved.has(v.id)?"liked":""}" data-save="${esc(v.id)}"><span class="bubble">${icon("save")}</span><span>${saved.has(v.id)?"Saved":"Save"}</span></button>
        <button class="action" data-share="${esc(v.id)}"><span class="bubble">${icon("share")}</span><span>${fmt(v.shareCount)||"Share"}</span></button>
        <div class="disc"></div>
      </div><div class="progress"><i></i></div>
    </section>`;
  }


  function appendNewCards(){
    if(currentView!=="home")return;
    const frag=document.createDocumentFragment();
    while(renderedCount<videos.length){
      const i=renderedCount,v=videos[i];
      const holder=document.createElement("div");holder.innerHTML=reelMarkup(v,i).trim();
      const reel=holder.firstElementChild;frag.appendChild(reel);
      renderedCount++;
    }
    feed.appendChild(frag);
    bindNewCards();
    observeNewCards();
  }

  function bindNewCards(){
    feed.querySelectorAll(".reel:not([data-bound])").forEach(r=>{
      r.dataset.bound="1";
      const v=r.querySelector("video");
      r.querySelector(".tap").onclick=()=>toggle(r);
      v.addEventListener("timeupdate",()=>{if(v.duration)r.querySelector(".progress i").style.width=((v.currentTime/v.duration)*100)+"%"});
      r.querySelector("[data-like]").onclick=()=>{
        const id=r.dataset.id;liked.has(id)?liked.delete(id):liked.add(id);persist("blobe-scroll-liked",liked);
        const b=r.querySelector("[data-like]");b.classList.toggle("liked",liked.has(id));b.lastElementChild.textContent=liked.has(id)?"Liked":fmt(videoById(id)?.likeCount)
      };
      r.querySelector("[data-save]").onclick=()=>{
        const id=r.dataset.id;
        if(saved.has(id)){
          saved.delete(id);
          savedVideos.delete(id);
        }else{
          const item=videoById(id);
          saved.add(id);
          if(item)savedVideos.set(id,item);
        }
        persistSaved();
        const b=r.querySelector("[data-save]");b.classList.toggle("liked",saved.has(id));b.lastElementChild.textContent=saved.has(id)?"Saved":"Save";
        toast(saved.has(id)?"Saved":"Removed");
        if(currentView==="saved-player"&&!saved.has(id)){
          const nextIndex=Number(r.dataset.index)||0;
          setTimeout(()=>{
            const remaining=getSavedItems();
            if(remaining.length)showSavedPlayer(Math.min(nextIndex,remaining.length-1));
            else showSaved();
          },0);
        }
      };
      r.querySelector("[data-comment]").onclick=()=>openComments(r.dataset.id);
      r.querySelector("[data-share]").onclick=()=>shareVideo(r.dataset.id);
      r.querySelector("[data-profile]").onclick=()=>openProfile(r.querySelector("[data-profile]").dataset.profile,false);
    });
  }

  function setupObserver(){
    observer?.disconnect();
    observer=new IntersectionObserver(entries=>{
      for(const e of entries){
        if(e.isIntersecting&&e.intersectionRatio>.72){
          activeFeedElement=e.target;
          if(e.target.classList.contains("reel")){
            activeIndex=Number(e.target.dataset.index);activate(activeIndex);
            if(currentView==="home"&&activeIndex>=videos.length-4)loadMore(false)
          }
        }else if(e.target.classList.contains("reel")&&!e.isIntersecting){
          e.target.querySelector("video")?.pause();e.target.classList.add("paused")
        }
      }
    },{root:feed,threshold:[.2,.72,.9]});
  }

  function observeNewCards(){
    if(!observer)setupObserver();
    feed.querySelectorAll(".reel:not([data-observed])").forEach(el=>{el.dataset.observed="1";observer.observe(el)});
  }


  function pauseAll(except=null){
    feed.querySelectorAll(".reel").forEach(r=>{if(r!==except){r.querySelector("video")?.pause();r.classList.add("paused")}})
  }
  function activate(i,force=false){
    const r=feed.querySelector(`.reel[data-index="${i}"]`);if(!r)return;
    pauseAll(r);const v=r.querySelector("video");v.muted=!soundOn;
    if(force||v.paused)v.play().then(()=>r.classList.remove("paused")).catch(()=>r.classList.add("paused"))
  }
  function toggle(r){
    const v=r.querySelector("video");
    if(v.paused){pauseAll(r);v.muted=!soundOn;v.play().then(()=>r.classList.remove("paused")).catch(()=>{})}else{v.pause();r.classList.add("paused")}
  }

  async function openComments(id){
    const v=videoById(id);
    commentsTitle.textContent=v?`${fmt(v.commentCount)} comments`:"Comments";
    commentsList.innerHTML=`<div style="text-align:center;padding:30px;color:#888"><div class="spinner"></div>Loading comments…</div>`;
    profileDrawer.classList.remove("open");
    drawer.classList.add("open");
    backdrop.classList.add("open");
    try{
      const data=await api("/comment/list",{url:id,count:30,cursor:0});
      const cs=data?.comments||[];
      commentsList.innerHTML=cs.length?cs.map(c=>{
        const u=c.user||{};
        const username=u.unique_id||u.uniqueId||u.nickname||"user";
        let avatar=u.avatar||u.avatar_thumb||u.avatarThumb||"";
        try{if(avatar)avatar=new URL(avatar,SERVICE_ORIGIN).href}catch{}
        const av=avatar
          ?`<img src="${esc(avatar)}" alt="">`
          :`<div class="cavi">${esc(username.slice(0,2).toUpperCase())}</div>`;
        return`<div class="comment">
          <button class="comment-user" data-comment-profile="${esc(username)}">
            ${av}
            <div class="ctext">
              <b>@${esc(username)}</b>
              ${esc(c.text||"")}
              <small>♥ ${fmt(c.digg_count)} · ${fmt(c.reply_total)} replies</small>
            </div>
          </button>
        </div>`;
      }).join(""):`<div style="padding:30px;text-align:center;color:#888">No public comments returned.</div>`;

      commentsList.querySelectorAll("[data-comment-profile]").forEach(btn=>{
        btn.addEventListener("click",()=>openProfile(btn.dataset.commentProfile,true));
      });
    }catch(e){
      commentsList.innerHTML=`<div style="padding:30px;text-align:center;color:#888">Couldn’t load comments.</div>`;
    }
  }

  function closeComments(){
    drawer.classList.remove("open");
    if(!profileDrawer.classList.contains("open"))backdrop.classList.remove("open");
  }

  function profileAvatarURL(user){
    const raw=user?.avatarLarger||user?.avatarMedium||user?.avatarThumb||user?.avatar||"";
    if(!raw)return "";
    try{return new URL(raw,SERVICE_ORIGIN).href}catch{return raw}
  }

  function closeProfile(){
    profileDrawer.classList.remove("open");
    if(profileReturnToComments){
      drawer.classList.add("open");
      backdrop.classList.add("open");
      profileReturnToComments=false;
    }else if(!drawer.classList.contains("open")){
      backdrop.classList.remove("open");
    }
  }

  async function openProfile(username,fromComments=false){
    username=String(username||"").replace(/^@/,"").trim();
    if(!username)return;

    currentProfileUsername=username;
    profileReturnToComments=!!fromComments;

    if(fromComments)drawer.classList.remove("open");
    else drawer.classList.remove("open");

    profileTitle.textContent="@"+username;
    profileContent.innerHTML=`<div class="profile-loading"><div class="spinner"></div>Loading profile…</div>`;
    profileDrawer.classList.add("open");
    backdrop.classList.add("open");

    const [detailResult,postsResult]=await Promise.allSettled([
      api("/user/info",{unique_id:username}),
      api("/user/posts",{unique_id:username,count:30,cursor:"0"})
    ]);

    if(currentProfileUsername!==username)return;

    const detail=detailResult.status==="fulfilled"?(detailResult.value||{}):{};
    const postData=postsResult.status==="fulfilled"?(postsResult.value||{}):{};
    const user=detail.user||{};
    const stats=detail.stats||{};
    const rawPosts=Array.isArray(postData)?postData:(postData.videos||[]);
    const posts=rawPosts.map(normalize).filter(p=>p.id&&(p.cover||p.play));

    const handle=user.uniqueId||user.unique_id||username;
    const nickname=user.nickname||handle;
    const avatar=profileAvatarURL(user)||posts.find(p=>p.avatar)?.avatar||"";
    const bio=user.signature||"";
    const verified=!!user.verified;

    const avatarHTML=avatar
      ?`<img class="profile-big-avatar" src="${esc(avatar)}" alt="">`
      :`<div class="profile-big-fallback">${esc(handle.slice(0,2).toUpperCase())}</div>`;

    const grid=posts.length?posts.map((p,i)=>`
      <button class="profile-post" data-profile-post="${esc(p.id)}" title="${esc(p.title)}">
        <img src="${esc(p.cover)}" alt="" loading="lazy">
        <span class="profile-post-shade">▶ ${fmt(p.playCount)}</span>
      </button>
    `).join(""):`<div class="profile-empty" style="grid-column:1/-1">No recent public posts were returned.</div>`;

    profileContent.innerHTML=`
      <div class="profile-hero">
        <div class="profile-identity">
          ${avatarHTML}
          <div class="profile-names">
            <h2>${esc(nickname)}${verified?'<span class="verified">✓</span>':""}</h2>
            <div class="handle">@${esc(handle)}</div>
          </div>
        </div>
        <div class="profile-stats">
          <div class="profile-stat"><b>${fmt(stats.followerCount)}</b><span>Followers</span></div>
          <div class="profile-stat"><b>${fmt(stats.followingCount)}</b><span>Following</span></div>
          <div class="profile-stat"><b>${fmt(stats.heartCount||stats.heart)}</b><span>Likes</span></div>
        </div>
        ${bio?`<div class="profile-bio">${esc(bio)}</div>`:""}
      </div>
      <div class="profile-posts-head"><span>Posts</span><span>${fmt(stats.videoCount||posts.length)}</span></div>
      <div class="profile-grid">${grid}</div>
    `;

    profileContent.querySelectorAll("[data-profile-post]").forEach(btn=>{
      btn.addEventListener("click",()=>{
        const post=posts.find(p=>p.id===btn.dataset.profilePost);
        if(!post)return;

        let index=videos.findIndex(v=>v.id===post.id);
        if(index<0){
          ids.add(post.id);
          videos.push(post);
          appendNewCards();
          index=videos.length-1;
        }

        profileReturnToComments=false;
        closeProfile();
        if(currentView!=="home")showHome();
        const target=feed.querySelector(`.reel[data-index="${index}"]`);
        target?.scrollIntoView({behavior:"smooth"});
        setTimeout(()=>activate(index,true),250);
      });
    });

    if(detailResult.status==="rejected"&&postsResult.status==="rejected"){
      profileContent.innerHTML=`<div class="profile-empty"><b style="display:block;color:#fff;margin-bottom:7px">Profile unavailable</b>Couldn’t load this creator right now.</div>`;
    }
  }

  async function shareVideo(id){
    const v=videoById(id);if(!v)return;
    const url=`${SOURCE_ORIGIN}/@${v.username}/video/${v.id}`;
    try{if(navigator.share)await navigator.share({title:v.title,url});else{await navigator.clipboard.writeText(url);toast("Blobe Scroll link copied")}}catch{}
  }

  function toggleSound(){
    soundOn=!soundOn;
    const v=feed.querySelector(`.reel[data-index="${activeIndex}"] video`);if(v)v.muted=!soundOn;
    document.querySelector("#soundBtn span").textContent=soundOn?"Sound on":"Sound off";
    toast(soundOn?"Sound on":"Sound off")
  }

  function getSavedItems(){
    return [...savedVideos.values()].filter(v=>saved.has(String(v.id)));
  }

  function savedCardMarkup(v,i){
    return`<button class="saved-card" type="button" data-saved-open="${i}" title="${esc(v.title)}">
      <span class="saved-thumb">
        ${v.cover?`<img src="${esc(v.cover)}" alt="" loading="lazy">`:""}
        <span class="saved-count">▶ ${fmt(v.playCount)}</span>
      </span>
      <span class="saved-card-title">${esc(v.title)}</span>
      <span class="saved-card-user">@${esc(v.username)}</span>
    </button>`;
  }

  function updateViewNav(){
    const savedView=currentView==="saved-grid"||currentView==="saved-player";
    document.getElementById("homeBtn").classList.toggle("active",currentView==="home");
    document.getElementById("savedBtn").classList.toggle("active",savedView);
    document.getElementById("mHome").classList.toggle("active",currentView==="home");
    document.getElementById("mSaved").classList.toggle("active",savedView);
    feedTitle.textContent=savedView?"Saved":"For You";
    feed.classList.toggle("saved-grid-mode",currentView==="saved-grid");
    savedBackBtn.classList.toggle("show",currentView==="saved-player");
  }

  function showHome(){
    if(currentView==="home"){
      feed.scrollTo({top:0,behavior:"smooth"});
      return;
    }
    pauseAll();
    currentView="home";
    activeIndex=0;
    activeFeedElement=null;
    renderedCount=0;
    feed.innerHTML="";
    updateViewNav();
    appendNewCards();
    feed.scrollTo({top:0});
    if(videos.length)setTimeout(()=>activate(0,true),120);
    else loadMore(true);
  }

  function showSaved(){
    pauseAll();
    currentView="saved-grid";
    activeIndex=0;
    activeFeedElement=null;
    observer?.disconnect();
    updateViewNav();
    const items=getSavedItems();
    if(!items.length){
      feed.innerHTML=`<div class="saved-library"><div class="saved-library-empty"><div><h2>No saved videos</h2><p>Tap the bookmark button on a video and it will appear here as a thumbnail.</p></div></div></div>`;
      feed.scrollTo({top:0});
      return;
    }
    feed.innerHTML=`<div class="saved-library">${items.map((v,i)=>savedCardMarkup(v,i)).join("")}</div>`;
    feed.querySelectorAll("[data-saved-open]").forEach(card=>{
      card.addEventListener("click",()=>showSavedPlayer(Number(card.dataset.savedOpen)||0));
    });
    feed.scrollTo({top:0});
  }

  function showSavedPlayer(startIndex=0){
    pauseAll();
    const items=getSavedItems();
    if(!items.length){showSaved();return}
    startIndex=Math.max(0,Math.min(items.length-1,Number(startIndex)||0));
    currentView="saved-player";
    activeIndex=startIndex;
    activeFeedElement=null;
    observer?.disconnect();
    updateViewNav();
    feed.innerHTML=items.map((v,i)=>reelMarkup(v,i)).join("");
    bindNewCards();
    setupObserver();
    observeNewCards();
    const target=feed.querySelector(`.reel[data-index="${startIndex}"]`);
    if(target)feed.scrollTop=target.offsetTop;
    setTimeout(()=>activate(startIndex,true),120);
  }

  function resetFeed(){
    if(currentView!=="home"){
      currentView="home";
      updateViewNav();
    }
    loadMore(true)
  }

  function shuffleFeed(){
    if(currentView!=="home")showHome();
    pauseAll();
    videos.sort(()=>Math.random()-.5);
    renderedCount=0;feed.innerHTML="";
    appendNewCards();feed.scrollTo({top:0});setTimeout(()=>activate(0,true),120)
  }

  const ABOUT="Blobe Scroll is the best unblocked video site. It provides an accessible alternative to platforms like Instagram and TikTok. Created by Blobby Boi :)";
  document.getElementById("homeBtn").onclick=document.getElementById("mHome").onclick=showHome;
  document.getElementById("savedBtn").onclick=document.getElementById("mSaved").onclick=showSaved;
  savedBackBtn.onclick=showSaved;
  document.getElementById("refreshBtn").onclick=document.getElementById("mRefresh").onclick=resetFeed;
  document.getElementById("soundBtn").onclick=document.getElementById("mSound").onclick=toggleSound;
  document.getElementById("aboutBtn").onclick=document.getElementById("mAbout").onclick=()=>toast(ABOUT);
  document.getElementById("applyRegion").onclick=()=>{toast("VPN connected: "+regionSelect.options[regionSelect.selectedIndex].text);resetFeed()};
  document.getElementById("shuffleBtn").onclick=shuffleFeed;
  document.getElementById("closeComments").onclick=closeComments;
  document.getElementById("closeProfile").onclick=closeProfile;
  backdrop.onclick=()=>{
    profileReturnToComments=false;
    profileDrawer.classList.remove("open");
    drawer.classList.remove("open");
    backdrop.classList.remove("open");
  };

  window.addEventListener("keydown",e=>{
    if(drawer.classList.contains("open")||profileDrawer.classList.contains("open"))return;
    if(["ArrowDown","PageDown","ArrowUp","PageUp"].includes(e.key)){
      e.preventDefault();
      const cards=[...feed.querySelectorAll(".reel")];if(!cards.length)return;
      let current=activeFeedElement&&cards.includes(activeFeedElement)?cards.indexOf(activeFeedElement):0;
      const delta=(e.key==="ArrowDown"||e.key==="PageDown")?1:-1;
      cards[Math.max(0,Math.min(cards.length-1,current+delta))]?.scrollIntoView({behavior:"smooth"})
    }
    if(e.key===" "&&!/SELECT/.test(document.activeElement.tagName)){const r=activeFeedElement?.classList.contains("reel")?activeFeedElement:feed.querySelector(`.reel[data-index="${activeIndex}"]`);if(r){e.preventDefault();toggle(r)}}
  });

  guessRegion();
  updateViewNav();
  setupObserver();
  loadMore(true);
})();
</script>
</body>
</html>
